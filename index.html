<style>

#sh{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}

</style>

      (p.l||[]).forEach(f=>{if(f!=uid&&!(st.l[p.id]||[]).includes(f))add('l:'+f+':'+p.id,{y:'l',from:f,post:p.id})});
      const pc=st.c[p.id]||0;
      (p.c||[]).slice(pc).forEach((c,i)=>{const f=S.users.find(x=>x.u==c.u);if(f&&f.id!=uid)add('c:'+f.id+':'+p.id+':'+(pc+i),{y:'c',from:f.id,post:p.id,x:c.x})});
    });
    if(ch)jset('fnl_'+uid,list.slice(0,100));
  }
  jset('fns_'+uid,cur);
};
const openN=()=>{nOld=seenT();jset('fnt_'+uid,Date.now());go('notif')};
const closeN=()=>{jset('fnt_'+uid,Date.now());go('feed')};
const srow=()=>{
  const ids=[...new Set(S.posts.filter(alive).map(p=>p.uid))].sort((a,b)=>unseen(b)-unseen(a));
  return `<div class="sr"><button class="sb" onclick="go('newstory')" aria-label="Hikoya qo'shish"><span class="ring add">+</span><span class="sm m">Qo'shish</span></button>${ids.map(id=>`<button class="sb" onclick="openS('${id}')"><span class="ring${unseen(id)?' un':''}">${av(id,56)}</span><span class="sm cut">${esc(id==uid?'Siz':(U(id).n||'?').split(' ')[0])}</span></button>`).join('')}</div>`;
};
const showS=()=>{
  clearTimeout(stT);
  const l=storiesOf(sv.uid),el=$('#sv');
  if(sv.i>=l.length||sv.i<0)return closeS();
  const p=l[sv.i];mark(p.id);
  el.hidden=false;document.body.style.overflow='hidden';
  el.innerHTML=`<div class="sbars">${l.map((_,k)=>`<i class="${k<sv.i?'d':k==sv.i?'a':''}"><b></b></i>`).join('')}</div>
<div class="shd">${av(p.uid,36)}<div class="fx"><b>${esc(p.n)}</b> <span class="sm" style="opacity:.7">${ago(p.t)}</span></div>${p.uid==uid?`<button class="sx" onclick="delS('${p.id}')">O'chirish</button>`:''}<button class="sx" onclick="closeS()" aria-label="Yopish">✕</button></div>
<div class="sbody${p.i?'':' t'}">${p.i?`<img src="${p.i}" alt="">`:''}${p.x?`<p class="scap${p.i?'':' big'}">${esc(p.x)}</p>`:''}</div>
<div class="stap l" onclick="stepS(-1)"></div><div class="stap r" onclick="stepS(1)"></div>`;
  stT=setTimeout(()=>stepS(1),5000);
};
const openS=id=>{const l=storiesOf(id);if(!l.length)return;const a=seen();let i=l.findIndex(p=>!a.includes(p.id));sv={uid:id,i:i<0?0:i};showS()};
const stepS=d=>{sv.i=Math.max(0,sv.i+d);showS()};
const closeS=()=>{clearTimeout(stT);const el=$('#sv');el.hidden=true;el.innerHTML='';document.body.style.overflow='';draw()};
const delS=async id=>{
  if(!confirm("Hikoyani o'chirasizmi?"))return;
  clearTimeout(stT);
  try{await deleteDoc(doc(fs,'posts',id))}catch(e){bad(e)}
  S.posts=S.posts.filter(p=>p.id!=id);
  showS();
};
const pickS=f=>{
  if(!f.files[0])return;
  const r=new FileReader();
  r.onload=()=>{const m=new Image();m.onload=()=>{
    const k=Math.min(1,900/Math.max(m.width,m.height)),c=document.createElement('canvas');
    c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);
    simg=c.toDataURL('image/jpeg',.65);$('#pv').src=simg;
  };m.src=r.result};
  r.readAsDataURL(f.files[0]);
};
const addStory=async()=>{
  const x=$('#sx').value.trim();
  if(!x&&!simg)return er("Matn yoki rasm qo'shing");
  const M=me();
  try{await addDoc(collection(fs,'posts'),{uid,u:M.u,n:M.n,x,i:simg,t:Date.now(),l:[],c:[],s:1});simg='';go('feed')}catch(e){bad(e)}
};
const delP=async id=>{
  if(!confirm("Postni o'chirasizmi?"))return;
  try{await deleteDoc(doc(fs,'posts',id));S.posts=S.posts.filter(p=>p.id!=id);draw()}catch(e){bad(e)}
};
const chPw=async()=>{
  const a=$('#pw0').value,b=$('#pw1').value,m=$('#pwm');
  const say=(t,ok)=>{m.textContent=t;m.style.color=ok?'var(--f)':''};
  if(!a||!b)return say("Ikkala parolni kiriting");
  if(b.length<6)return say("Yangi parol kamida 6 ta belgi bo'lsin");
  try{
    const u=au.currentUser;
    await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,a));
    await updatePassword(u,b);
    $('#pw0').value='';$('#pw1').value='';say("Parol o'zgartirildi ✓",1);
  }catch(e){say(e.code=='auth/invalid-credential'||e.code=='auth/wrong-password'?"Hozirgi parol noto'g'ri":(AE[e.code]||("Xato: "+(e.code||e.message))))}
};
const closeSh=()=>{const el=$('#sh');el.hidden=true;el.innerHTML=''};
const showLikes=id=>{
  const p=S.posts.find(a=>a.id==id);if(!p)return;
  const l=p.l||[],el=$('#sh');
  el.innerHTML=`<div class="sheet"><div class="row" style="margin-bottom:8px"><h1 class="fx" style="margin:0;font-size:1.2rem">Yoqtirganlar</h1><button class="g pill" onclick="closeSh()" aria-label="Yopish">✕</button></div>${l.length?l.map(i=>{const x=U(i);return `<div class="li" onclick="closeSh();pf('${i}')">${av(i,40)}<div class="fx"><b>${esc(x.n)}</b><div class="m sm">@${esc(x.u)}</div></div></div>`}).join(''):'<p class="m">Hali hech kim yoqtirmagan.</p>'}</div>`;
  el.hidden=false;
};
let lastTap=0;
const tapImg=(e,id)=>{
  const n=Date.now();
  if(n-lastTap<320){
    lastTap=0;
    const b=document.createElement('div');b.className='hb';b.style.left=e.clientX+'px';b.style.top=e.clientY+'px';
    b.innerHTML=svg(IC.heart,true).replace('width="24" height="24"','width="84" height="84"');
    document.body.appendChild(b);setTimeout(()=>b.remove(),750);
    const p=S.posts.find(a=>a.id==id);
    if(p&&!(p.l||[]).includes(uid))like(id);
  }else lastTap=n;
};
Object.assign(window,{go,ff,tg,srch,auth,like,cm,dm,send,pick,add,out,pf,editMe,pickAv,delAv,saveP,back,openS,stepS,closeS,delS,pickS,addStory,closeSh,showLikes,tapImg,delP,chPw,openN,closeN});

const post=p=>{const l=p.l||[],c=p.c||[],on=l.includes(uid);return `<article class="post">
<div class="ph" onclick="pf('${p.uid}')">${av(p.uid,38)}<div class="fx"><b>${esc(p.n)}</b><div class="m sm">@${esc(p.u)} · ${ago(p.t)}</div></div>${p.uid==uid?`<button class="g pill sm" onclick="event.stopPropagation();delP('${p.id}')" aria-label="Postni o'chirish">O'chirish</button>`:''}</div>
${p.i?`<img class="pimg" src="${p.i}" alt="" onclick="tapImg(event,'${p.id}')">`:''}
<div class="acts"><div class="hl"><button class="ic${on?' on':''}${popId==p.id?' pop':''}" onclick="like('${p.id}')" aria-label="Yoqdi">${svg(IC.heart,on)}</button><button class="ic lk" onclick="showLikes('${p.id}')" aria-label="Yoqtirganlar">${l.length}</button></div><span class="ic m">${svg(IC.chat)}<span>${c.length}</span></span></div>
${p.x?`<p class="tx">${esc(p.x)}</p>`:''}
${c.map(k=>{const x=S.users.find(a=>a.u==k.u)||{u:k.u,n:k.u};return `<div class="cm row" style="gap:8px;align-items:flex-start"${x.id?` onclick="pf('${x.id}')"`:''}>${avx(x,26,x.pic)}<div><b>${esc(k.u)}</b> ${esc(k.x)}</div></div>`}).join('')}
<div class="row cin"><input id="c${p.id}" placeholder="Izoh yozing" aria-label="Izoh"><button class="g" onclick="cm('${p.id}')">Yuborish</button></div>
</article>`};

function draw(){
  const A=$('#app'),M=me();
  const fid=document.activeElement&&document.activeElement.id;
  if(!ready){A.innerHTML=`<div style="padding-top:10vh"><div class="brand" style="font-size:3.2rem">Fable</div>${ik()}<p class="m">Yuklanmoqda…</p></div>`;return}
  if(!uid){
    A.innerHTML=`<div style="padding-top:10vh"><div class="brand" style="font-size:3.2rem">Fable</div>${ik()}<p class="m">Kunning ertagini ulashing.</p>
<input id="n" placeholder="Ismingiz" aria-label="Ismingiz" autocomplete="name"><input id="u" placeholder="Foydalanuvchi nomi" aria-label="Foydalanuvchi nomi" autocomplete="username"><input id="p" type="password" placeholder="Parol" aria-label="Parol" autocomplete="current-password">
<p id="er" class="er" role="alert"></p>
<button class="w" onclick="auth(1)">Ro'yxatdan o'tish</button>
<button class="g w" onclick="auth(0)">Kirish</button></div>`;
    first=false;return;
  }
  if(!M){A.innerHTML=`<div style="padding-top:10vh"><div class="brand" style="font-size:3.2rem">Fable</div>${ik()}<p class="m">Yuklanmoqda…</p><button class="g" onclick="out()">Chiqish</button></div>`;return}
  let h='';
  if(view=='feed'){
    const ps=S.posts.filter(p=>!p.s&&(!feedF||p.uid==uid||fl(uid).includes(p.uid)));
    h=`<div class="row" style="justify-content:space-between"><div class="brand">Fable</div><button class="g bellb" onclick="openN()" aria-label="Bildirishnomalar">${svg(IC.bell)}${nUnread()?`<span class="bd" style="top:-4px;left:auto;right:-4px">${nUnread()>9?'9+':nUnread()}</span>`:''}</button></div>${ik()}${srow()}<div class="tabs"><button class="${feedF?'':'on'}" onclick="ff(0)">Hammasi</button><button class="${feedF?'on':''}" onclick="ff(1)">Obunalar</button></div>`+(ps.length?ps.map(post).join(''):feedF?`<p class="m" style="margin-top:16px">Obuna bo'lgan odamlar hali post yozmagan.</p><button class="g" onclick="go('search')">Odam qidirish</button>`:`<p class="m" style="margin-top:16px">Hozircha post yo'q.</p><button onclick="go('new')">Birinchi postni yozing</button>`);
  }
  if(view=='search')h=`<h1>Qidiruv</h1><input type="search" id="q" value="${esc(q)}" placeholder="Ism yoki @nom" aria-label="Qidiruv" oninput="srch(this.value)"><div id="res" style="margin-top:8px">${res()}</div>`;
  if(view=='new')h=`<h1>Yangi post</h1><textarea id="tx" placeholder="Nima o'ylayapsiz?" aria-label="Post matni"></textarea>
<input type="file" accept="image/*" onchange="pick(this)" aria-label="Rasm tanlash"><img id="pv" class="pv" alt="" ${img?`src="${img}"`:''}>
<p id="er" class="er" role="alert"></p><button class="w" onclick="add()">Joylash</button>`;
  if(view=='chat'){
    const lt=id=>{const l=thread(id).pop();return l?l.time:0};
    const us=S.users.filter(a=>a.id!=uid).sort((a,b)=>lt(b.id)-lt(a.id));
    h='<h1>Chat</h1>'+(us.length?us.map(a=>{
      const l=thread(a.id).pop(),n=unread(a.id);
      return `<div class="li" onclick="dm('${a.id}')">${av(a.id,44)}<div class="fx"><b>${esc(a.n)}</b><div class="${n?'':'m '}sm cut"${n?' style="font-weight:600"':''}>${l?(l.f==uid?'Siz: ':'')+esc(l.x):'Xabar yozing'}</div></div>${n?`<span class="bd2">${n>9?'9+':n}</span>`:''}</div>`;
    }).join(''):'<p class="m">Hozircha boshqa foydalanuvchi yo\'q. Do\'stlaringiz Fable ga kirib ro\'yxatdan o\'tgach, ular shu yerda chiqadi.</p>');
  }
  if(view=='dm'){
    markRead(peer);const t=thread(peer);
    h=`<div class="row" style="margin-bottom:12px"><button class="g pill" onclick="go('chat')" aria-label="Orqaga">←</button>${av(peer,40)}<h1 style="margin:0">${esc(U(peer).n)}</h1></div>
<div>${t.length?t.map(m=>`<div class="bub${m.f==uid?' me':''}">${esc(m.x)}</div>`).join(''):'<p class="m">Hali xabar yo\'q. Birinchi bo\'lib yozing.</p>'}</div>
<div class="row" style="margin-top:12px"><input id="mg" placeholder="Xabar yozing" aria-label="Xabar"><button onclick="send()">Yuborish</button></div>`;
  }
  if(view=='notif'){
    const list=jget('fnl_'+uid,[]);
    h=`<div class="row" style="margin-bottom:12px"><button class="g pill" onclick="closeN()" aria-label="Orqaga">←</button><h1 style="margin:0">Bildirishnomalar</h1></div>`+(list.length?list.map(n=>{
      const w=n.y=='f'?"sizga obuna bo'ldi":n.y=='l'?"postingizni yoqtirdi ❤️":"izoh yozdi";
      return `<div class="li" onclick="pf('${n.from}')">${av(n.from,44)}<div class="fx"><div><b>${esc(U(n.from).n)}</b> ${w}</div>${n.x?`<div class="m sm cut">${esc(n.x)}</div>`:''}<div class="m sm">${ago(n.t)}</div></div>${n.t>nOld?'<span class="dot"></span>':''}</div>`}).join(''):'<p class="m">Hozircha bildirishnoma yo\'q. Kimdir yurak bossa, izoh yozsa yoki obuna bo\'lsa, shu yerda chiqadi.</p>');
  }
  if(view=='newstory')h=`<h1>Hikoya qo'shish</h1><p class="m sm">Hikoya 24 soatdan keyin o'chadi. Rasm, matn yoki ikkalasi.</p>
<textarea id="sx" maxlength="140" placeholder="Hikoya matni (140 belgigacha)" aria-label="Hikoya matni"></textarea>
<input type="file" accept="image/*" onchange="pickS(this)" aria-label="Rasm tanlash"><img id="pv" class="pv" alt="" ${simg?`src="${simg}"`:''}>
<p id="er" class="er" role="alert"></p><button class="w" onclick="addStory()">Joylash</button><button class="g w" onclick="go('feed')">Bekor qilish</button>`;
  if(view=='edit')h=`<h1>Profilni tahrirlash</h1>
<div class="row" style="margin-bottom:12px"><div id="pavw">${avx(M,96,ep===undefined?M.pic:ep)}</div><div class="fx"><input type="file" accept="image/*" onchange="pickAv(this)" aria-label="Profil rasmi">${(ep===undefined?M.pic:ep)?'<button class="g pill" onclick="delAv()">Rasmni olib tashlash</button>':''}</div></div>
<label class="m sm" for="bio">O'zingiz haqingizda (120 belgigacha)</label>
<textarea id="bio" maxlength="120" placeholder="Masalan: Samarqanddan. Suratlar va ertaklar.">${esc(M.bio||'')}</textarea>
<button class="w" onclick="saveP()">Saqlash</button><button class="g w" onclick="go('me')">Bekor qilish</button>
<h1 style="font-size:1.15rem;margin:28px 0 6px">Parolni o'zgartirish</h1>
<input id="pw0" type="password" placeholder="Hozirgi parol" autocomplete="current-password" aria-label="Hozirgi parol"><input id="pw1" type="password" placeholder="Yangi parol (kamida 6 ta belgi)" autocomplete="new-password" aria-label="Yangi parol">
<p id="pwm" class="er" role="alert"></p><button class="g w" onclick="chPw()">Parolni o'zgartirish</button>`;
  if(view=='user'){
    const x=U(pid),mine=S.posts.filter(p=>!p.s&&p.uid==pid),on=fl(uid).includes(pid);
    h=`<div class="row" style="margin-bottom:12px"><button class="g pill" onclick="back()" aria-label="Orqaga">←</button></div>
<div class="row">${av(pid,76)}<div><h1 style="margin:0">${esc(x.n)}</h1><div class="m">@${esc(x.u)}</div></div></div>
${x.bio?`<p class="bio">${esc(x.bio)}</p>`:''}
<div class="st"><div><b>${mine.length}</b>Postlar</div><div><b>${followers(pid).length}</b>Obunachilar</div><div><b>${fl(pid).length}</b>Obunalar</div></div>
<div class="row"><button class="pill${on?' g':''}" onclick="tg('${pid}')">${on?'Obunasiz ✓':"Obuna bo'lish"}</button><button class="g pill" onclick="dm('${pid}')">Xabar yozish</button></div>
<div class="grid" style="margin-top:16px">${mine.filter(p=>p.i).map(p=>`<img src="${p.i}" alt="">`).join('')}</div>`;
  }
  if(view=='me'){
    const mine=S.posts.filter(p=>!p.s&&p.uid==uid);
    h=`<div class="row">${av(uid,76)}<div><h1 style="margin:0">${esc(M.n)}</h1><div class="m">@${esc(M.u)}</div></div></div>
${M.bio?`<p class="bio">${esc(M.bio)}</p>`:''}
<div class="st"><div><b>${mine.length}</b>Postlar</div><div><b>${followers(uid).length}</b>Obunachilar</div><div><b>${fl(uid).length}</b>Obunalar</div></div>
<button class="g w" style="margin:0 0 16px" onclick="editMe()">Profilni tahrirlash</button>
<div class="grid">${mine.filter(p=>p.i).map(p=>`<img src="${p.i}" alt="">`).join('')}</div>
<button class="g w" onclick="out()">Chiqish</button>`;
  }
  const t=(v,l)=>`<button class="${view==v||(v=='chat'&&view=='dm')||(v=='me'&&view=='edit')||(v=='feed'&&(view=='newstory'||view=='notif'))?'on':''}" onclick="go('${v}')" aria-label="${l}">${svg(IC[v])}${v=='chat'&&view!='dm'&&totalUnread()?`<span class="bd">${totalUnread()>9?'9+':totalUnread()}</span>`:''}</button>`;
  A.innerHTML=h+`<nav class="nv">${t('feed','Bosh sahifa')}${t('search','Qidiruv')}${t('new','Yangi post')}${t('chat','Chat')}${t('me','Profil')}</nav>`;
  first=false;popId=0;
  try{const n=totalUnread();if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}
  if(fid){const el=$('#'+fid);if(el&&el.tagName=='INPUT'||el&&el.tagName=='TEXTAREA')el.focus()}
}
</script>
